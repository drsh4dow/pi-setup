\* expect: holds
\* Pi's graceful shutdown may never end. The launcher gets SIGTERM, then SIGKILL, as from bg_kill, or herdr closes the pane.
SPECIFICATION Spec
CONSTANT ShutdownCanHang = TRUE
CONSTANT DescendantStarts = FALSE
CONSTANT EnabledKills = {"launcherTerm", "launcherKill", "paneClose"}
INVARIANT TypeOK
PROPERTY NoProcessOutlivesLauncher KillEndsRun
