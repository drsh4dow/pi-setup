name: catchup-video

# The Manim renders take about three minutes, so they run only when something they depend on changes.
on:
  push:
    branches: [main]
    paths: &paths
      - agent/skills/catchup-video/**
      - .github/workflows/catchup-video.yml
      - scripts/ci/**
      - vite.config.ts
      - package.json
      - bun.lock
  pull_request:
    paths: *paths

# Every job here only reads the repository. Without this block, a job gets whatever the repository's default token grants.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  catchup-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the token stays out of .git/config, where every later step could read it.
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: false
          cache: true
      # ffmpeg joins the beats.
      # The pinned build comes from GitHub, not the apt mirror, whose stalls held jobs for 15 minutes.
      - id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ci/install-ffmpeg.sh') }}
      - run: scripts/ci/install-ffmpeg.sh ~/.cache/ci-ffmpeg
      # Saved right away, so a run whose checks fail still warms the next one.
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-ffmpeg
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      # cairo, pango, and pkg-config build the Manim wheels uv installs. Their .debs are cached per
      # runner image, because each one depends on the exact versions of the libraries the image ships.
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: header-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-header-debs
          key: header-debs-${{ steps.image.outputs.version }}-${{ hashFiles('.github/workflows/catchup-video.yml', 'scripts/ci/install-debs.sh') }}
      - run: scripts/ci/install-debs.sh ~/.cache/ci-header-debs libcairo2-dev libpango1.0-dev pkg-config
      - if: steps.header-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-header-debs
          key: ${{ steps.header-debs.outputs.cache-primary-key }}
      # setup-uv keys its cache by runner, Python version, and lockfile hash. Without the suffix, this key
      # equals that of a near-empty entry check.yml saved for the same lockfile, and on an exact hit
      # setup-uv skips its end-of-job save, so the built wheels would never reach the cache.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: agent/skills/catchup-video/python/uv.lock
          cache-suffix: catchup-video
      - run: vp install --frozen-lockfile
      # This step runs uv outside vp run, because vp gives a cached task only HOME, PATH, and a few other
      # variables. Inside it, uv would not see the UV_CACHE_DIR that setup-uv exports, and setup-uv's
      # end-of-job save of that directory would find nothing to cache.
      - name: Install the render environment
        run: node agent/skills/catchup-video/scripts/video.ts setup
      - run: vp run verify:catchup-video-scripts
