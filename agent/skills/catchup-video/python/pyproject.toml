# The render environment for scripts/video.ts, installed on first run into
# ~/.cache/catchup-video with `uv sync --frozen`. Never install it into the repo.
[project]
name = "catchup-video"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "manim==0.22.0",
  # Pillow 13 breaks Manim 0.22's ImageMobject ("Invalid mode for data type").
  "pillow>=12,<13",
]

[tool.uv]
package = false
